name = "model-test-demo"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# 前端部署后把 Worker 域名同步给前端（前端也可写死在 web/index.html）
DEEPSEEK_BASE_URL = "https://api.deepseek.com"

# 模型映射（tier → model）：用户不可自选，由服务端强制覆盖
# tier 0（免费）→ deepseek-chat；tier 1（VIP）→ deepseek-reasoner
MODEL_TIER0 = "deepseek-chat"
MODEL_TIER1 = "deepseek-reasoner"
DAILY_QUOTA_TIER0 = "20"
DAILY_QUOTA_TIER1 = "100"

[[d1_databases]]
binding = "DB"
database_name = "model-test-demo-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"
