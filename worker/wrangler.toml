name = "model-test-demo"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
DEEPSEEK_BASE_URL = "https://api.deepseek.com"

# 固定模型，所有用户统一（服务端强制覆盖，客户端不可自选）
MODEL = "deepseek-chat"
DAILY_QUOTA = "20"

[[d1_databases]]
binding = "DB"
database_name = "model-test-demo-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"
